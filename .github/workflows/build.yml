# SPDX-License-Identifier: GPL-3.0-or-later
name: Single-file builds

on:
  workflow_dispatch:
  push:
    tags: ['[0-9]*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            executable: fldigi-net-scheduler
          - runner: windows-2022
            platform: windows-x64
            executable: fldigi-net-scheduler.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Read application version
        id: version
        shell: bash
        run: |
          version=$(python -c 'from app_version import VERSION; print(VERSION)')
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $version" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Build executable
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --clean --noconfirm fldigi_net_scheduler.spec
      - name: Check packaged version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [[ "$(./dist/fldigi-net-scheduler --version)" == "FLDigi Net Scheduler ${{ steps.version.outputs.number }}" ]]
      - name: Check packaged version command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\dist\fldigi-net-scheduler.exe -ArgumentList '--version' -PassThru -Wait
          exit $app.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: fldigi-net-scheduler-v${{ steps.version.outputs.number }}-${{ matrix.platform }}
          path: dist/${{ matrix.executable }}
          if-no-files-found: error
