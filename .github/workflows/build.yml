# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and publish

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish (leave blank for an artifact-only build)
        type: string
  push:
    tags: ['[0-9]*']

concurrency:
  group: build-${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            asset: fldigi-net-scheduler
          - runner: windows-2022
            platform: windows-x64
            asset: fldigi-net-scheduler.exe
          - runner: macos-15
            platform: macos-arm64
            asset: fldigi-net-scheduler-macos-arm64.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Read application version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        shell: bash
        run: |
          version=$(python -c 'from app_version import VERSION; print(VERSION)')
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "$version" ]]; then
            echo "Tag $RELEASE_TAG does not match app version $version" >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build single-file executable
        if: runner.os != 'macOS'
        run: |
          python -m PyInstaller --clean --noconfirm fldigi_net_scheduler.spec
      - name: Check packaged version (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          [[ "$(./dist/fldigi-net-scheduler --version)" == "FLDigi Net Scheduler ${{ steps.version.outputs.number }}" ]]
      - name: Check packaged version command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = Start-Process -FilePath .\dist\fldigi-net-scheduler.exe -ArgumentList '--version' -PassThru -Wait
          exit $app.ExitCode
      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.number }}
        run: |
          mkdir -p build
          sips -s format icns assets/scheduler.png --out build/scheduler.icns
          python -m PyInstaller --clean --noconfirm --onedir --windowed \
            --name 'FLDigi Net Scheduler' --icon build/scheduler.icns \
            --osx-bundle-identifier io.github.jeffreycentex.fldigi-net-scheduler \
            --add-data 'assets/scheduler.png:assets' fldigi_net_scheduler.py
          bundle='dist/FLDigi Net Scheduler.app'
          [[ "$(lipo -archs "$bundle/Contents/MacOS/FLDigi Net Scheduler")" == arm64 ]]
          [[ "$("$bundle/Contents/MacOS/FLDigi Net Scheduler" --version)" == "FLDigi Net Scheduler $APP_VERSION" ]]
          codesign --verify --deep --strict "$bundle"
          ditto -c -k --keepParent "$bundle" dist/fldigi-net-scheduler-macos-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: fldigi-net-scheduler-v${{ steps.version.outputs.number }}-${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'); then
            for file in release-assets/*; do
              if ! grep -Fxq -- "${file##*/}" <<< "$existing"; then
                gh release upload "$RELEASE_TAG" "$file" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
