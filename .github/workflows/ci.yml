# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }     # oldest supported (README)
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile fldigi_net_scheduler.py sched_core.py nets_csv.py mock_fldigi.py mock_kiwiremote.py

      - name: SPDX headers
        shell: bash
        run: |
          missing=$(grep -L "SPDX-License-Identifier: GPL-3.0-or-later" *.py tests/*.py || true)
          if [ -n "$missing" ]; then echo "Missing SPDX header: $missing"; exit 1; fi

      - name: Tests
        run: python -m pytest -v
